[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocketrag-mcp"
version = "1.0.0"
description = "FastMCP server for PocketRAG"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "google-auth>=2.20.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pocketrag"]
